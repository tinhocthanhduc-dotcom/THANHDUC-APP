# Công cụ đăng web chạy một lệnh rồi thôi (xem docs/dang-web.md): scripts/dang-web.sh kiem-tra
# Máy chạy nền dang-web-may nay nằm trong docker-compose.yml, tự cập nhật bằng lệnh cập nhật app thường lệ.
services:
  dang-web:
    extends:
      file: docker-compose.yml
      service: dang-web-may
    profiles: ["web"]
    command: []
    restart: "no"
