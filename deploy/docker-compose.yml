# Chạy trên VPS: cd core && docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: thanhduc
      POSTGRES_USER: thanhduc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Không mở cổng database ra ngoài; chỉ api nối vào qua mạng nội bộ.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thanhduc -d thanhduc"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      TD_DATABASE_URL: postgresql+psycopg://thanhduc:${DB_PASSWORD}@db:5432/thanhduc
      TD_SECRET_KEY: ${SECRET_KEY:?Đặt SECRET_KEY trong deploy/.env}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Đặt DOMAIN trong deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddydata:
