# Chạy trên VPS, trong thư mục repo: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: thanhduc
      POSTGRES_USER: thanhduc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Không mở cổng database ra ngoài; chỉ api nối vào qua mạng nội bộ.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thanhduc -d thanhduc"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      TD_DATABASE_URL: postgresql+psycopg://thanhduc:${DB_PASSWORD}@db:5432/thanhduc
      TD_SECRET_KEY: ${SECRET_KEY:?Đặt SECRET_KEY trong deploy/.env}
      TD_COOKIE_SECURE: "true"
      TD_COMMISSION_START: ${TD_COMMISSION_START:-2027-01-01}
      TD_ADVANCE_MAX_PCT: ${TD_ADVANCE_MAX_PCT:-50}
      TD_SLOT_SANG: ${TD_SLOT_SANG:-07:30-11:30}
      TD_SLOT_CHIEU: ${TD_SLOT_CHIEU:-13:30-17:30}
      TD_SALES_DEFAULT_WAREHOUSE: ${TD_SALES_DEFAULT_WAREHOUSE:-58}
      TD_PERF_LOG: ${TD_PERF_LOG:-true}
      TD_ZALO_BOT_TOKEN: ${TD_ZALO_BOT_TOKEN:-}
      TD_ZALO_WEBHOOK_SECRET: ${TD_ZALO_WEBHOOK_SECRET:-}
      # Trợ lý Zalo dùng chung khóa OpenAI với máy đăng web.
      TD_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TD_ZALO_AI_MODEL: ${TD_ZALO_AI_MODEL:-gpt-5-mini}
    volumes:
      - files:/app/data/files
      # Thư mục làm việc của màn Đăng web, dùng chung với máy đăng web (dang-web-may bên dưới).
      - ${WEB_THU_MUC:-../../THANHDUC-WEB}:/web
    depends_on:
      db:
        condition: service_healthy

  # Máy đăng web chạy nền cho màn Đăng web (TUẤN 02/11/2026: chạy chung lệnh cập nhật, không cần bat-may riêng).
  # Image nặng vì có bộ tách nền nhưng có bộ nhớ đệm, chỉ dựng lại khi code dang_web đổi.
  dang-web-may:
    build:
      context: ..
      dockerfile: dang_web/Dockerfile
    environment:
      # Chỉ đọc: công cụ tự đặt phiên database ở chế độ read-only.
      TD_DATABASE_URL: postgresql+psycopg://thanhduc:${DB_PASSWORD}@db:5432/thanhduc
      WP_URL: ${WP_URL:-https://thanhduc.vn}
      WP_USER: ${WP_USER:-}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # claude | openai | mau (không AI). Để trống: dùng loại nào có khóa.
      WEB_AI_NHA_CUNG_CAP: ${WEB_AI_NHA_CUNG_CAP:-}
      WEB_OPENAI_MODEL: ${WEB_OPENAI_MODEL:-gpt-5.5}
      WEB_AI_MODEL: ${WEB_AI_MODEL:-claude-opus-5-5}
      WEB_AI_EFFORT: ${WEB_AI_EFFORT:-medium}
      WEB_AI_TRA_WEB: ${WEB_AI_TRA_WEB:-true}
      WEB_TACH_NEN: ${WEB_TACH_NEN:-true}
      # Mô hình tách nền: isnet-general-use (mặc định, viền sắc) hoặc u2net (bản cũ).
      WEB_MO_HINH_TACH_NEN: ${WEB_MO_HINH_TACH_NEN:-isnet-general-use}
      WEB_ANH_DINH_DANG: ${WEB_ANH_DINH_DANG:-webp}
      WEB_ANH_KICH_THUOC: ${WEB_ANH_KICH_THUOC:-1200}
      WEB_DANG_GIA: ${WEB_DANG_GIA:-true}
      WEB_VAT_PHAN_TRAM: ${WEB_VAT_PHAN_TRAM:-0}
      WEB_HOTLINE: ${WEB_HOTLINE:-}
      WEB_CHUYEN_MUC_BAI: ${WEB_CHUYEN_MUC_BAI:-}
    volumes:
      # ~/THANHDUC-WEB trên Z2: anh-goc, ghi-chu, chu-de.txt, ket-qua...
      - ${WEB_THU_MUC:-../../THANHDUC-WEB}:/data
    depends_on:
      - db
    command: ["cho-viec"]
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Đặt DOMAIN trong deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddydata:
  files:
