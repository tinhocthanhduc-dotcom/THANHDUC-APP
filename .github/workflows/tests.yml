name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thanhduc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migration khớp với models
        env:
          TD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/thanhduc_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  test:
    # Chia ~1.700 test thành 5 phần chạy song song, mỗi phần có PostgreSQL riêng.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thanhduc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Test phần ${{ matrix.shard }}/5
        env:
          TD_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/thanhduc_test
          TD_TEST_SHARD: ${{ matrix.shard }}/5
        run: pytest -q
