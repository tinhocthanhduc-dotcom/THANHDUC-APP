name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thanhduc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Migration khớp với models
        env:
          TD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/thanhduc_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Test
        env:
          TD_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/thanhduc_test
        run: pytest -q
